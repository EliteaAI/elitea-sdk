name: "XR02 - get_tests: Retrieve tests by JQL query"
description: |
  Verify the Xray 'get_tests' tool retrieves tests using JQL query.

  Objective: Test JQL-based test retrieval from Xray

  Expected Behavior:
  - JQL query executes without errors
  - Returns list of tests matching query
  - Response contains test details
  - No error indicators in output

toolkits:
  - id: ${XRAY_TOOLKIT_ID}
    name: ${XRAY_TOOLKIT_NAME}

state:
  project_key:
    type: str
    value: ${XRAY_PROJECT_KEY:EL}
  jql_query:
    type: str
    value: "created >= -3d AND labels in (ELITEA_AI_CREATED) ORDER BY assignee"
  get_tests_result:
    type: str
  expected_success_indicators:
    type: list
    value: ["issueId", "jira", "testType"]
  error_indicators:
    type: list
    value: ["Unable to get tests", "Tool execution error", "failed to", "exception occurred"]
  test_results:
    type: dict

entry_point: get_tests
nodes:
  - id: get_tests
    type: toolkit
    input:
      - jql_query
    input_mapping:
      jql:
        type: variable
        value: jql_query
    output:
      - get_tests_result
    structured_output: false
    tool: get_tests
    toolkit_name: ${XRAY_TOOLKIT_NAME}
    transition: validate_results

  - id: validate_results
    type: llm
    input:
      - get_tests_result
      - jql_query
      - expected_success_indicators
      - error_indicators
    input_mapping:
      chat_history:
        type: fixed
        value: []
      system:
        type: fixed
        value: You are a strict quality assurance validator. Only return valid JSON.
      task:
        type: fstring
        value: |
          Analyze the output from the 'get_tests' tool execution.

          JQL Query: {jql_query}
          Get Tests Result: {get_tests_result}
          Expected Success Indicators: {expected_success_indicators}
          Error Indicators: {error_indicators}

          This is a POSITIVE test - we expect successful test retrieval.

          IMPORTANT:
          - The tool result may be rendered either as strict JSON or as a Python-style serialized list/dict string.
          - Treat either representation as SUCCESS when it clearly contains test objects.
          - Do NOT fail just because the text is not strict JSON.
          - An empty list [] is also VALID when no tests match the JQL.

          Validation Criteria (ALL must pass for test_passed=true):
          1. tool_executed: True if the result is non-empty and does not contain tool failure phrases like "Tool execution error" or "Unable to get tests"
          2. no_errors: Output does NOT contain TOOL error indicators (e.g., "Tool execution error", "failed to", "exception occurred"). Ignore the word "error" if it appears inside test content.
          3. has_extracted_tests: Response is a list-like collection of test objects, whether formatted as JSON or Python-style serialized text. [] also passes.
          4. has_test_data: If the list is non-empty, at least one item contains test details such as issueId and jira/testType. Pass this check for an empty list.

          Return JSON test_results:
          {{
            "test_passed": boolean (true only if ALL criteria pass),
            "tool_executed": boolean,
            "no_errors": boolean,
            "has_extracted_tests": boolean,
            "has_test_data": boolean,
            "tests_count": integer (best-effort number of items in the list, 0 for an empty list),
            "success_indicator_found": "which indicator was found or 'none'",
            "error_indicator_found": "which error indicator was found or 'none'",
            "error": string | null
          }}

          Treat visible list output containing issueId/jira/testType fields as a valid successful response even if it is not strict JSON.

          Return ONLY the JSON object.
    model: ${DEFAULT_LLM_MODEL}
    output:
      - test_results
    structured_output_dict:
      test_results: dict
    transition: END
