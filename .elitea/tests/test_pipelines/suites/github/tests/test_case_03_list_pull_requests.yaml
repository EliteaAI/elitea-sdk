name: "GH03 - List Pull Requests"
description: "Verify list_pull_requests tool retrieves PR list from repository"

toolkits:
  - id: ${GITHUB_TOOLKIT_ID}
    name: ${GITHUB_TOOLKIT_NAME}

state:
  input:
    type: str
  messages:
    type: list
  max_count:
    type: int
    value: 5
  tool_result:
    type: str
  pr_number:
    type: int
    value: 5
  pr_result:
    type: str
  test_results:
    type: dict

entry_point: invoke_list_prs

nodes:
  - id: invoke_list_prs
    type: toolkit
    tool: list_open_pull_requests
    toolkit_name: ${GITHUB_TOOLKIT_NAME}
    input:
      - max_count
    input_mapping:
      max_count:
        type: variable
        value: max_count
    output:
      - tool_result
    structured_output: true
    transition: verify_pr

  - id: verify_pr
    type: toolkit
    tool: get_pull_request
    toolkit_name: ${GITHUB_TOOLKIT_NAME}
    input:
      - pr_number
    input_mapping:
      pr_number:
        type: variable
        value: pr_number
    output:
      - pr_result
    structured_output: true
    transition: process_results

  - id: process_results
    type: llm
    model: gpt-4o
    input:
      - tool_result
      - pr_result
    input_mapping:
      system:
        type: fixed
        value: "You are a quality assurance validator."
      task:
        type: fstring
        value: |
          Analyze the output from two GitHub operations:
          1. 'list_open_pull_requests' tool (limited to 5 PRs)
          2. 'get_pull_request' for PR #5 (to verify specific PR exists)

          List PRs Result: {tool_result}
          PR #5 Verification: {pr_result}

          Perform the following checks:

          1. Confirm list_open_pull_requests executed successfully (result is not null and is a valid list output, even if empty).
          2. Confirm PR #5 verification succeeded (pr_result is not an error and number matches 5).
          3. Determine whether the pull request list has valid structure when items are present.
          4. Treat an empty open-PR list as valid if the verification call for PR #5 succeeds, because PR #5 may be closed.

          If there is an error, return the error message in the error field.

          Return a JSON object named test_results with the following structure:

          {{
          "test_passed": boolean,
          "tool_executed": boolean,
          "has_pr_5": boolean,
          "prs_have_numbers": boolean,
          "error": string | null,
          "failed_checks": list of strings
          }}

          Return **EXACTLY** **NONNEGOTIATABLE** only the `test_results` JSON object. Do not use markdown ```json when returning the json. Do not include any explanations, summaries, or additional text.
      chat_history:
        type: fixed
        value: []
    output:
      - test_results
    structured_output_dict:
        test_results: "dict"
    transition: END
