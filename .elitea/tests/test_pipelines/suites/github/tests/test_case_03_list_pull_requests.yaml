name: "GH03 - List Pull Requests"
description: "Verify list_pull_requests tool retrieves PR list from repository"

toolkits:
  - id: ${GITHUB_TOOLKIT_ID}
    name: ${GITHUB_TOOLKIT_NAME}

state:
  input:
    type: str
  messages:
    type: list
  max_count:
    type: int
    value: 5
  tool_result:
    type: str
  test_results:
    type: dict

entry_point: invoke_list_prs

nodes:
  - id: invoke_list_prs
    type: toolkit
    tool: list_open_pull_requests
    toolkit_name: ${GITHUB_TOOLKIT_NAME}
    input:
      - max_count
    input_mapping:
      max_count:
        type: variable
        value: max_count
    output:
      - tool_result
    structured_output: true
    transition: process_results

  - id: process_results
    type: llm
    model: gpt-4o
    input:
      - tool_result
    input_mapping:
      system:
        type: fixed
        value: "You are a quality assurance validator."
      task:
        type: fstring
        value: |
          Analyze the output from the GitHub 'list_open_pull_requests' tool (limited to 5 PRs).

          List PRs Result: {tool_result}

          Perform the following checks:

          1. Confirm list_open_pull_requests executed successfully (result is a valid list, not null, and not an error payload).
          2. Determine whether the returned items have proper structure with 'number' and 'title' fields.
          3. Record how many PRs were returned, including zero if the repository currently has no open PRs.

          If there is an error, return the error message in the error field.

          Return a JSON object named test_results with the following structure:

          {{
          "test_passed": boolean,
          "tool_executed": boolean,
          "prs_count": integer,
          "prs_have_numbers": boolean,
          "error": string | null,
          "failed_checks": list of strings
          }}

          Return **EXACTLY** **NONNEGOTIATABLE** only the `test_results` JSON object. Do not use markdown ```json when returning the json. Do not include any explanations, summaries, or additional text.
      chat_history:
        type: fixed
        value: []
    output:
      - test_results
    structured_output_dict:
        test_results: "dict"
    transition: END
