name: "GH06 - Project Issue Workflow"
description: "Test project issue lifecycle: create_issue_on_project, search_project_issues, list_project_issues, update_issue_on_project, comment, close"

toolkits:
  - id: ${GITHUB_TOOLKIT_ID}
    name: ${GITHUB_TOOLKIT_NAME}

state:
  board_repo:
    type: str
    value: 'EliteaAI/elitea-sdk'
  input:
    type: str
  issue_body:
    type: str
  issue_number:
    type: str
  issue_title:
    type: str
  list_result:
    type: str
  messages:
    type: list
  project_number:
    type: int
    value: 4
  project_title:
    type: str
    value: AI_testing_board
  search_query:
    type: str
  search_result:
    type: str
  test_results:
    type: dict
  tool_result:
    type: str
  update_result:
    type: str
  updated_body:
    type: str
  updated_title:
    type: str
entry_point: prepare_issue
nodes:
  - id: prepare_issue
    type: code
    code:
      type: fixed
      value: |
        import time
        import random
        import string

        timestamp = time.strftime('%Y%m%d-%H%M%S')
        random_id = ''.join(random.choices(string.ascii_lowercase + string.digits, k=6))

        issue_title = f"GH22-Test-{random_id}"
        nl = chr(10)
        issue_body = f"Automated test issue for GH22 Project Issue Workflow.{nl}{nl}**Created:** {timestamp}{nl}**ID:** {random_id}{nl}{nl}This issue will be searched, updated, commented, and closed."
        search_query = f"GH22-Test-{random_id}"

        {"issue_title": issue_title, "issue_body": issue_body, "search_query": search_query}
    input: []
    output:
      - issue_title
      - issue_body
      - search_query
    structured_output: true
    transition: create_issue_on_project
  - id: create_issue_on_project
    type: toolkit
    input:
      - board_repo
      - project_title
      - issue_title
      - issue_body
    input_mapping:
      board_repo:
        type: variable
        value: board_repo
      body:
        type: variable
        value: issue_body
      project_title:
        type: variable
        value: project_title
      title:
        type: variable
        value: issue_title
    output:
      - tool_result
    structured_output: true
    tool: create_issue_on_project
    toolkit_name: ${GITHUB_TOOLKIT_NAME}
    transition: validate_create
  - id: validate_create
    type: code
    code:
      type: fixed
      value: |
        import json
        import re

        tool_result = elitea_state.get('tool_result', '')
        text = tool_result if isinstance(tool_result, str) else json.dumps(tool_result)
        match = re.search(r"number '\s*(\d+)\s*'|number\s+(\d+)|#(\d+)", text)
        issue_number = None
        if match:
            issue_number = next(group for group in match.groups() if group)

        create_issue_ok = ('created' in text.lower()) and bool(issue_number)

        {
          "issue_number": issue_number or "",
          "test_results": {
            "create_issue_ok": create_issue_ok,
            "issue_number": issue_number or ""
          }
        }
    input:
      - tool_result
    output:
      - issue_number
      - test_results
    structured_output: true
    transition: search_project_issues
  - id: search_project_issues
    type: toolkit
    input:
      - board_repo
      - project_number
      - search_query
    input_mapping:
      board_repo:
        type: variable
        value: board_repo
      items_count:
        type: fixed
        value: 5
      project_number:
        type: variable
        value: project_number
      search_query:
        type: variable
        value: search_query
    output:
      - search_result
    structured_output: true
    tool: search_project_issues
    toolkit_name: ${GITHUB_TOOLKIT_NAME}
    transition: validate_search
  - id: validate_search
    type: code
    code:
      type: fixed
      value: |
        import json

        search_result = elitea_state.get('search_result', '')
        issue_title = elitea_state.get('issue_title', '')
        issue_number = elitea_state.get('issue_number', '')
        previous = elitea_state.get('test_results', {}) or {}

        parsed = search_result
        if isinstance(search_result, str):
            try:
                parsed = json.loads(search_result)
            except Exception:
                parsed = {}

        items = parsed.get('items', []) if isinstance(parsed, dict) else []
        search_ok = isinstance(parsed, dict) and bool(parsed.get('title')) and isinstance(items, list)
        issue_found = False
        for item in items:
            content = item.get('content', {}) if isinstance(item, dict) else {}
            title = str(content.get('title', ''))
            number = str(content.get('number', ''))
            if issue_title == title or (issue_number and issue_number == number):
                issue_found = True
                break

        {
          "test_results": {
            "create_issue_ok": bool(previous.get('create_issue_ok')),
            "issue_number": str(previous.get('issue_number', issue_number) or ''),
            "search_ok": search_ok,
            "issue_found_in_search": issue_found,
            "search_items_count": len(items)
          }
        }
    input:
      - search_result
      - issue_title
      - issue_number
      - test_results
    output:
      - test_results
    structured_output: true
    transition: list_project_issues
  - id: list_project_issues
    type: toolkit
    input:
      - board_repo
      - project_number
    input_mapping:
      board_repo:
        type: variable
        value: board_repo
      items_count:
        type: fixed
        value: 10
      project_number:
        type: variable
        value: project_number
    output:
      - list_result
    structured_output: true
    tool: list_project_issues
    toolkit_name: ${GITHUB_TOOLKIT_NAME}
    transition: validate_list
  - id: validate_list
    type: code
    code:
      type: fixed
      value: |
        import json

        list_result = elitea_state.get('list_result', '')
        issue_title = elitea_state.get('issue_title', '')
        issue_number = elitea_state.get('issue_number', '')
        previous = elitea_state.get('test_results', {}) or {}

        parsed = list_result
        if isinstance(list_result, str):
            try:
                parsed = json.loads(list_result)
            except Exception:
                parsed = {}

        items = parsed.get('items', []) if isinstance(parsed, dict) else []
        list_ok = isinstance(parsed, dict) and bool(parsed.get('title')) and isinstance(items, list) and len(items) > 0
        issue_in_list = False
        for item in items:
            content = item.get('content', {}) if isinstance(item, dict) else {}
            title = str(content.get('title', ''))
            number = str(content.get('number', ''))
            if issue_title == title or (issue_number and issue_number == number):
                issue_in_list = True
                break

        {
          "test_results": {
            "create_issue_ok": bool(previous.get('create_issue_ok')),
            "issue_number": str(previous.get('issue_number', issue_number) or ''),
            "search_ok": bool(previous.get('search_ok')),
            "issue_found_in_search": bool(previous.get('issue_found_in_search')),
            "search_items_count": int(previous.get('search_items_count', 0) or 0),
            "list_ok": list_ok,
            "issue_in_list": issue_in_list,
            "list_items_count": len(items)
          }
        }
    input:
      - list_result
      - issue_title
      - issue_number
      - test_results
    output:
      - test_results
    structured_output: true
    transition: prepare_update
  - id: prepare_update
    type: code
    code:
      type: fixed
      value: |
        import time
        import random
        import string

        timestamp = time.strftime('%Y-%m-%d %H:%M:%S')
        random_id = ''.join(random.choices(string.ascii_lowercase + string.digits, k=4))

        nl = chr(10)
        updated_title = elitea_state.get('issue_title', '') + f"-UPDATED-{random_id}"
        updated_body = f"Issue updated by GH22 workflow at {timestamp}.{nl}{nl}Update ID: {random_id}"

        {"updated_title": updated_title, "updated_body": updated_body}
    input:
      - issue_title
    output:
      - updated_title
      - updated_body
    structured_output: true
    transition: update_issue_on_project
  - id: update_issue_on_project
    type: toolkit
    input:
      - board_repo
      - project_title
      - issue_number
      - updated_title
      - updated_body
    input_mapping:
      board_repo:
        type: variable
        value: board_repo
      body:
        type: variable
        value: updated_body
      issue_number:
        type: variable
        value: issue_number
      project_title:
        type: variable
        value: project_title
      title:
        type: variable
        value: updated_title
    output:
      - update_result
    structured_output: true
    tool: update_issue_on_project
    toolkit_name: ${GITHUB_TOOLKIT_NAME}
    transition: validate_update
  - id: validate_update
    type: code
    code:
      type: fixed
      value: |
        import json

        update_result = elitea_state.get('update_result', '')
        issue_number = elitea_state.get('issue_number', '')
        issue_title = elitea_state.get('issue_title', '')
        previous = elitea_state.get('test_results', {}) or {}

        text = update_result if isinstance(update_result, str) else json.dumps(update_result)
        update_ok = 'updated' in text.lower() or 'success' in text.lower()
        create_ok = bool(previous.get('create_issue_ok'))
        search_ok = bool(previous.get('search_ok'))
        list_ok = bool(previous.get('list_ok'))

        {
          "test_results": {
            "test_passed": create_ok and search_ok and list_ok and update_ok,
            "operations": {
              "create_issue_on_project": create_ok,
              "search_project_issues": search_ok,
              "list_project_issues": list_ok,
              "update_issue_on_project": update_ok
            },
            "details": {
              "issue_number": str(issue_number or previous.get('issue_number', '')),
              "issue_title": issue_title,
              "issue_found_in_search": bool(previous.get('issue_found_in_search')),
              "issue_in_list": bool(previous.get('issue_in_list')),
              "search_items_count": int(previous.get('search_items_count', 0) or 0),
              "list_items_count": int(previous.get('list_items_count', 0) or 0)
            },
            "error": None
          }
        }
    input:
      - update_result
      - issue_number
      - issue_title
      - test_results
    output:
      - test_results
    structured_output: true
    transition: END
