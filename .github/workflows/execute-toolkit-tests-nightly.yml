name: Execute Toolkit Tests Nightly
run-name: "Nightly Toolkit Tests: ${{ inputs.environment || vars.NIGHTLY_TESTS_ENVIRONMENT || 'local' }}"

# Runs the full toolkit pipeline-test suite every night at 03:00 (UTC+3) = 00:00 UTC.
# Scheduled runs take their settings from repository variables (schedule events carry no inputs):
#   NIGHTLY_TESTS_ENVIRONMENT     - local | dev | stage | stage2 | prod | <custom name>   (default: local)
#   NIGHTLY_TESTS_EXCLUDE_SUITES  - comma-separated suites to skip                        (default below)
#   NIGHTLY_TESTS_BUG_REPORTING   - 'false' disables automatic bug creation                (default: true)
#   NIGHTLY_TESTS_RP_REPORTING    - 'true' sends results to ReportPortal/OneTest           (default: false)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests in (local, dev, stage, stage2, prod or a custom name)'
        required: false
        type: string
        default: ''
      exclude_suites:
        description: 'Comma-separated suite names to exclude (empty = repository default)'
        required: false
        type: string
        default: ''
      enable_bug_reporting:
        description: 'Enable automatic bug report creation in EliteaAI/elitea-sdk'
        required: false
        type: boolean
        default: true
      enable_rp_reporting:
        description: 'Enable ReportPortal/OneTest reporting'
        required: false
        type: boolean
        default: false

concurrency:
  group: nightly-toolkit-tests
  cancel-in-progress: false

env:
  DEFAULT_EXCLUDE_SUITES: 'bitbucket,figma,qtest,testrail,gitlab'

jobs:
  configure-matrix:
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.set-matrix.outputs.test_matrix }}
      has-tests: ${{ steps.set-matrix.outputs.has-tests }}
      environment: ${{ steps.settings.outputs.environment }}
      enable_bug_reporting: ${{ steps.settings.outputs.enable_bug_reporting }}
      enable_rp_reporting: ${{ steps.settings.outputs.enable_rp_reporting }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/execute-toolkit-tests-on-demand.yml
            .github/actions/generate-test-matrix
          sparse-checkout-cone-mode: false

      - name: Resolve nightly settings
        id: settings
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ inputs.environment }}"
            EXCLUDE="${{ inputs.exclude_suites }}"
            BUG_REPORTING="${{ inputs.enable_bug_reporting }}"
            RP_REPORTING="${{ inputs.enable_rp_reporting }}"
          else
            BUG_REPORTING="${{ vars.NIGHTLY_TESTS_BUG_REPORTING || 'true' }}"
            RP_REPORTING="${{ vars.NIGHTLY_TESTS_RP_REPORTING || 'false' }}"
          fi
          ENVIRONMENT="${ENVIRONMENT:-${{ vars.NIGHTLY_TESTS_ENVIRONMENT || 'local' }}}"
          EXCLUDE="${EXCLUDE:-${{ vars.NIGHTLY_TESTS_EXCLUDE_SUITES || env.DEFAULT_EXCLUDE_SUITES }}}"

          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "exclude_suites=${EXCLUDE}" >> $GITHUB_OUTPUT
          echo "enable_bug_reporting=${BUG_REPORTING}" >> $GITHUB_OUTPUT
          echo "enable_rp_reporting=${RP_REPORTING}" >> $GITHUB_OUTPUT
          echo "::notice::Nightly run on '${ENVIRONMENT}', excluding '${EXCLUDE}', bug reporting=${BUG_REPORTING}, RP reporting=${RP_REPORTING}"

      - name: Generate test matrix
        id: set-matrix
        uses: ./.github/actions/generate-test-matrix
        with:
          mode: on-demand
          test_cases_dir: all
          exclude_suites: ${{ steps.settings.outputs.exclude_suites }}
          workflow_file: .github/workflows/execute-toolkit-tests-on-demand.yml

  test-execution:
    needs: configure-matrix
    if: needs.configure-matrix.outputs.has-tests == 'true'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        data: ${{ fromJson(needs.configure-matrix.outputs.test_matrix) }}
    uses: ./.github/workflows/test-runner-reusable.yml
    with:
      test_cases_dir: ${{ matrix.data.suite }}
      tests_to_run: ${{ matrix.data.tests_to_run }}
      environment: ${{ needs.configure-matrix.outputs.environment }}
      enable_parallel: true
      enable_bug_reporting: ${{ needs.configure-matrix.outputs.enable_bug_reporting == 'true' }}
      enable_rp_reporting: ${{ needs.configure-matrix.outputs.enable_rp_reporting == 'true' }}
    secrets: inherit
