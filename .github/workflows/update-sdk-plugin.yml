name: Update SDK Plugin

on:
  workflow_call:
    inputs:
      sdk_version:
        description: "Published elitea-sdk version"
        required: true
        type: string
      target_branch:
        description: "Target branch in sdk_plugin"
        required: true
        type: string
      create_pr:
        description: "Create a pull request instead of pushing directly"
        required: false
        type: boolean
        default: false
    secrets:
      SDK_PLUGIN_DEPLOYMENT_KEY:
        required: true
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "Published elitea-sdk version"
        required: true
        type: string
      create_pr:
        description: "Create a pull request? (false = push directly)"
        required: true
        type: boolean
        default: false
      target_branch:
        description: "Target branch in sdk_plugin (leave empty to use current branch)"
        required: false
        type: string
        default: ""

jobs:
  update-sdk-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # The former completed-workflow design checked out and executed a branch name
      # taken from a privileged event. Keep automation code on the trusted
      # caller commit and treat the target branch only as data for sdk_plugin.
      - name: Checkout trusted SDK automation
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate inputs
        id: validated
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}
        run: |
          python .github/scripts/update_sdk_plugin_version.py \
            --validate-only \
            --version "$SDK_VERSION" \
            --target-branch "$TARGET_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout sdk_plugin
        uses: actions/checkout@v4
        with:
          repository: EliteaAI/sdk_plugin
          ssh-key: ${{ secrets.SDK_PLUGIN_DEPLOYMENT_KEY }}
          path: sdk_plugin
          ref: ${{ steps.validated.outputs.target_branch }}

      - name: Update requirements.txt and metadata.json
        env:
          SDK_VERSION: ${{ steps.validated.outputs.sdk_version }}
        run: >-
          python .github/scripts/update_sdk_plugin_version.py
          --plugin-dir sdk_plugin
          --version "$SDK_VERSION"

      - name: Commit and push changes
        if: inputs.create_pr == false
        env:
          SDK_VERSION: ${{ steps.validated.outputs.sdk_version }}
        run: |
          cd sdk_plugin
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add requirements.txt metadata.json
          if git diff --cached --quiet; then
            echo "::notice title=No Changes::sdk_plugin already at version $SDK_VERSION"
          else
            git commit -m "chore: update elitea-sdk to version $SDK_VERSION"
            git push
          fi

      - name: Create Pull Request
        if: inputs.create_pr == true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update elitea-sdk to version ${{ steps.validated.outputs.sdk_version }}"
          title: "Update elitea-sdk to version ${{ steps.validated.outputs.sdk_version }}"
          body: |
            This PR updates elitea-sdk to version ${{ steps.validated.outputs.sdk_version }}:
            - `requirements.txt`: pip dependency pin
            - `metadata.json`: plugin version for pylon

            Automatically triggered by PyPI release.
            Target branch: ${{ steps.validated.outputs.target_branch }}
          branch: update-sdk-${{ steps.validated.outputs.target_branch }}
          base: ${{ steps.validated.outputs.target_branch }}
          delete-branch: true

      - name: Show version bump annotation
        env:
          SDK_VERSION: ${{ steps.validated.outputs.sdk_version }}
        run: |
          echo "::notice title=Version Bump::Updated sdk_plugin to elitea-sdk $SDK_VERSION"
